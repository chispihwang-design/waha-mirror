name: mirror-waha
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de devlikeapro/waha a espejar"
        required: true
        default: "latest-2026.9.2"
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copiar imagen
        run: |
          SRC="docker.io/devlikeapro/waha:${{ inputs.tag }}"
          DST="ghcr.io/${{ github.repository_owner }}/waha:${{ inputs.tag }}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          docker buildx imagetools inspect "$DST" | head -20
