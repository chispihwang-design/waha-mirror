name: mirror-waha
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de devlikeapro/waha a publicar (debe existir un release con waha-<tag>.tar.gz)"
        required: true
        default: "latest-2026.9.2"
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bajar la imagen del release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${{ inputs.tag }}" -R "${{ github.repository }}" -p "waha-${{ inputs.tag }}.tar.gz" -D .
      - name: Cargar y publicar
        run: |
          docker load -i "waha-${{ inputs.tag }}.tar.gz"
          DST="ghcr.io/${{ github.repository_owner }}/waha:${{ inputs.tag }}"
          docker tag "devlikeapro/waha:${{ inputs.tag }}" "$DST"
          docker push "$DST"
